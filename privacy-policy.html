.lang-btn{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--panel2);color:var(--slate);font-size:.78rem;font-weight:700;cursor:pointer;}
.lang-btn.active{background:var(--cyan);color:#04121c;border-color:var(--cyan);}
.back-link{font-size:.82rem;color:var(--slate);}

.hero{padding:50px 0 20px;text-align:center;}
.hero h1{font-size:2rem;font-weight:900;color:#fff;margin-bottom:10px;}
.hero p{color:var(--slate);font-size:.9rem;}
.updated{display:inline-block;background:var(--cyan-dim);color:var(--cyan);font-size:.75rem;font-weight:700;padding:4px 14px;border-radius:20px;margin-top:12px;}

.content{padding:30px 0 80px;}
.section{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:16px;padding:26px 24px;margin-bottom:18px;}

.section.guarantee h2{color:var(--mint);}

.section ul{padding-inline-start:20px;margin-bottom:8px;}
.guarantee-steps{display:grid;gap:10px;margin-top:14px;}

.guarantee-step .num{background:var(--mint);color:#04160d;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.85rem;flex-shrink:0;}

function applyLang(lang){
  const c = content[lang];
  document.getElementById('html-root').setAttribute('lang', lang);
  document.getElementById('html-root').setAttribute('dir', lang==='ar' ? 'rtl' : 'ltr');
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if (c[key] !== undefined) el.textContent = c[key];
  });
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
  localStorage.setItem('donia_landing_lang', lang);
}
document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>applyLang(btn.dataset.lang));
});
