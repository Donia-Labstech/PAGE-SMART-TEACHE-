.content{padding:30px 0 80px;}
.section{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:16px;padding:26px 24px;margin-bottom:18px;}

.section ul{padding-inline-start:20px;margin-bottom:8px;}
.section table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.85rem;}
.section th,.section td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--border);}
.section th{color:var(--slate);font-weight:700;}
.note-box{background:var(--amber-dim);border-right:4px solid var(--amber);border-radius:8px;padding:12px 16px;font-size:.85rem;margin-top:10px;}

.contact-box{text-align:center;background:var(--mint-dim);border:1px solid rgba(0,230,118,.3);border-radius:16px;padding:26px;}
.contact-box a{display:inline-block;margin-top:12px;background:var(--mint);color:#04160d;padding:10px 24px;border-radius:8px;font-weight:800;font-size:.88rem;}

footer{text-align:center;padding:30px;color:var(--slate-dim);font-size:.78rem;border-top:1px solid var(--border);}

function applyLang(lang){
  const c = content[lang];
  document.getElementById('html-root').setAttribute('lang', lang);
  document.getElementById('html-root').setAttribute('dir', lang==='ar' ? 'rtl' : 'ltr');
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if (c[key] !== undefined) el.textContent = c[key];
  });
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
  localStorage.setItem('donia_landing_lang', lang);
}
document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>applyLang(btn.dataset.lang));
});
applyLang(localStorage.getItem('donia_landing_lang') || 'ar');
</script>
